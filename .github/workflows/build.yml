name: Build and publish signed Flatpak repository

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      force_rebuild:
        type: boolean
        default: false
    secrets:
      FLATPAK_GPG_PRIVATE_KEY:
        required: true
      FLATPAK_GPG_FINGERPRINT:
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
      input_id: ${{ steps.plan.outputs.input_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - name: Compare build inputs with durable state
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python3 scripts/repository-state.py plan
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.deploy == 'true'
        with:
          name: publication-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      # Same multiarch builder image used by upstream's release metadata workflow.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:68c521931eccf47dfa05c1c80f43be0993cce516417a633aa34913707da57cf2
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate pinned packaging
        run: |
          python3 -c 'import yaml'
          python3 scripts/validate.py
          flatpak-builder --show-manifest io.github.TheZwiss.backspace.yml > resolved-manifest.json
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Restore disposable download and compiler caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .flatpak-builder/downloads
            .flatpak-builder/ccache
          key: downloads-v1-${{ matrix.arch }}-${{ needs.plan.outputs.input_id }}
          restore-keys: downloads-v1-${{ matrix.arch }}-
      - name: Build using upstream manifest and offline scripts
        uses: andyholmes/flatter@ba9d3856bb0e59b43ba4684fe72128003f1b7706
        with:
          files: io.github.TheZwiss.backspace.yml
          arch: ${{ matrix.arch }}
          # Flatter's cache is never used as durable repository storage.
          cache-key: ''
          upload-bundles: false
          upload-pages-artifact: false
          flatpak-builder-args: |
            --user
            --install-deps-from=flathub
            --default-branch=stable
            --disable-updates
      - name: Archive successful unsigned build
        run: tar -czf build-${{ matrix.arch }}.tar.gz -C repo .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ matrix.arch }}
          path: build-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp io.github.TheZwiss.backspace.yml upstream.lock.json diagnostics/
          cp resolved-manifest.json diagnostics/ 2>/dev/null || true
          flatpak list > diagnostics/installed-runtimes.txt
          find .flatpak-builder -type f \( -name '*.log' -o -name 'config.log' \) \
            -exec cp --parents '{}' diagnostics/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: diagnostics-${{ matrix.arch }}
          path: diagnostics/
          retention-days: 14

  prepare:
    needs: [plan, build]
    # A failed/skipped architecture must not produce a partial publication.
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.deploy == 'true' &&
      (needs.build.result == 'success' ||
       (needs.plan.outputs.build == 'false' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
          python3 -m pip install --require-hashes -r requirements.txt
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: publication-plan
      - name: Restore the complete durable repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repository-state.py restore
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.plan.outputs.build == 'true'
        with:
          pattern: build-*
          path: artifacts/downloads
          merge-multiple: true
      - name: Extract verified build archives
        if: needs.plan.outputs.build == 'true'
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('state', 'scripts/repository-state.py')
          import sys
          sys.path.insert(0, 'scripts')
          state = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(state)
          for arch in ['x86_64', 'aarch64']:
              state.extract(f'artifacts/downloads/build-{arch}.tar.gz', f'artifacts/{arch}/repo')
          PY
      - name: Sign, validate and persist the complete candidate
        if: needs.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_FINGERPRINT: ${{ secrets.FLATPAK_GPG_FINGERPRINT }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --quiet --import
          unset FLATPAK_GPG_PRIVATE_KEY
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = "${FLATPAK_GPG_FINGERPRINT^^}"
          bash scripts/publish.sh
          python3 scripts/repository-state.py save
      - name: Verify restored candidate before a deployment retry
        if: needs.plan.outputs.build == 'false'
        run: |
          python3 scripts/site.py
          python3 scripts/verify-remote.py site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: [plan, prepare]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.prepare.result == 'success' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment

  acknowledge:
    needs: [plan, deploy]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.deploy.result == 'success' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - run: python3 -m pip install --require-hashes -r requirements.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: publication-plan
      - name: Record successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repository-state.py deployed
