name: Validate packaging automation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree gnupg shellcheck
          python3 -m pip install --require-hashes -r requirements.txt
      - run: |
          python3 scripts/validate.py
          flatpak-builder --show-manifest io.github.TheZwiss.backspace.yml > /dev/null
          python3 -m unittest discover -s tests -v
          shellcheck scripts/*.sh
      - name: Check workflow syntax
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint" -color
